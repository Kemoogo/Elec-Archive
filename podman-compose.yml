services:
  mongo:
    container_name: elec-archive-mongo
    image: docker.io/library/mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  app:
    container_name: elec-archive-app
    build:
      context: .
      dockerfile: Containerfile
    expose:
      - "3000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/elec-archive}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - UPLOAD_PATH=${UPLOAD_PATH:-/app/public/uploads}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-الأرشيف الإلكتروني}
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  nginx:
    container_name: elec-archive-nginx
    build:
      context: .
      dockerfile: nginx/Containerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:
